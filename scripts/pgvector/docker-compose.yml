# Postgres + pgvector pour la bibliothèque Odoo.
# Rattaché au réseau Docker de n8n, aucun port publié : seul n8n y accède (hôte `pgvector`).
# Déployé sur le VPS dans /root/pgvector/ avec un .env contenant PGVECTOR_DB / PGVECTOR_USER / PGVECTOR_PASSWORD.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB}
      POSTGRES_USER: ${PGVECTOR_USER}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

volumes:
  pgvector-data:

networks:
  n8n:
    name: n8n-ijcp_default
    external: true
